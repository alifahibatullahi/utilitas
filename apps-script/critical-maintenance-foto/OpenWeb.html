<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Tanpa ini, teks berkarakter non-ASCII (tanda pisah panjang, nama item bersimbol) bisa
       tampil kacau saat berkasnya dibuka di luar Apps Script maupun saat browser menebak
       encoding sendiri. -->
  <meta charset="utf-8">
  <style>
    html, body { height: 100%; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif; margin: 0; color: #202124;
      display: flex; flex-direction: column; background: #fff;
    }
    .scroll { flex: 1; overflow-y: auto; padding: 18px 20px 6px; }
    .foot { padding: 12px 20px 14px; border-top: 1px solid #e8eaed; background: #fff; }

    .kind {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px;
      border-radius: 999px; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
    }
    .kind.critical { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

    .item { font-size: 22px; font-weight: 700; line-height: 1.25; margin-top: 10px; word-wrap: break-word; }

    .uraian {
      font-size: 17px; font-weight: 600; line-height: 1.45; margin-top: 12px;
      background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 10px; padding: 12px 14px;
      max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
    }

    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #9aa0a6; }
    .val { font-size: 17px; font-weight: 700; color: #202124; word-wrap: break-word; margin-top: 2px; }

    .note { font-size: 12px; color: #5f6368; line-height: 1.5; }
    .scroll .note { margin-top: 16px; }
    button {
      font-size: 14px; font-weight: 700; padding: 12px 16px; border: 0; border-radius: 8px;
      background: #1a73e8; color: #fff; cursor: pointer; width: 100%;
    }
    button:hover { background: #1765cc; }
    .hint { font-size: 11px; color: #5f6368; margin-top: 10px; line-height: 1.45; }
    a { color: #1a73e8; word-break: break-all; font-size: 11px; }
  </style>
</head>
<body>
  <div class="scroll" id="content"></div>
  <div class="foot">
    <button onclick="go()">Buka web &amp; upload foto</button>
    <div class="hint" id="hint"></div>
  </div>

  <script>
    // Scriptlet force-print (tanda seru) dipakai supaya tanda kutip di dalam JSON tidak
    // ikut di-escape. JANGAN menulis contoh scriptlet di komentar mana pun pada file ini:
    // mesin template Apps Script memindai seluruh berkas, bukan hanya bagian non-komentar,
    // sehingga scriptlet kosong di dalam komentar pun ikut dievaluasi dan bikin
    // "SyntaxError: Unexpected token ';'".
    var ctx = JSON.parse(<?!= JSON.stringify(ctx) ?>);

    var html = '';
    if (ctx.mode === 'record') {
      // Empat informasi ini saja, sebesar mungkin: cukup untuk memastikan "ini memang baris
      // yang saya pilih" sebelum operator menekan tombolnya. Tanggal, notifikasi, status,
      // dan nomor baris sengaja tidak ikut — sudah terlihat di spreadsheet di belakangnya.
      var critical = ctx.kindLabel === 'Critical';

      html += '<span class="kind ' + (critical ? 'critical' : '') + '">' + escapeHtml(ctx.kindLabel) + '</span>';
      html += '<div class="item">' + escapeHtml(itemLabel()) + '</div>';
      html += '<div class="uraian">' + escapeHtml(ctx.uraian || '(tanpa uraian)') + '</div>';

      html += '<div class="pair">';
      html += field('Scope', ctx.scope);
      html += field(critical ? 'Yang Melaporkan' : 'Foreman', critical ? ctx.pelapor : ctx.foreman);
      html += '</div>';

      html += '<div class="note">Foto diunggah lewat web &mdash; halaman langsung terbuka pada pop up record ini.</div>';
    } else {
      html += '<div class="note">' + escapeHtml(ctx.note || '') + '</div>';
    }

    document.getElementById('content').innerHTML = html;
    document.getElementById('hint').innerHTML =
      'Tidak terbuka otomatis? Klik tautan ini:<br><a href="' + escapeAttr(ctx.url) + '" target="_blank" rel="noopener">'
      + escapeHtml(ctx.url) + '</a>';

    // Varian menempel di belakang nama item, sama seperti di web ("… Phosphat Pump D").
    function itemLabel() {
      var nama = String(ctx.item == null ? '' : ctx.item).replace(/\s+/g, ' ').trim();
      var varian = String(ctx.varian == null ? '' : ctx.varian).replace(/\s+/g, ' ').trim();
      return varian ? nama + ' ' + varian : nama;
    }

    // Nilai kosong tetap memakai tanda hubung: kedua slot ini selalu ada, dan kolom yang
    // menghilang justru membuat operator ragu apakah barisnya benar.
    function field(label, value) {
      return '<div><div class="lbl">' + escapeHtml(label) + '</div>'
           + '<div class="val">' + escapeHtml(value || '—') + '</div></div>';
    }

    function go() {
      window.open(ctx.url, '_blank', 'noopener');
      google.script.host.close();
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
