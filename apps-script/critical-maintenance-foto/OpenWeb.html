<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    html, body { height: 100%; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif; margin: 0; color: #202124;
      background: #fff; display: flex; align-items: center; justify-content: center;
      padding: 18px 20px; box-sizing: border-box;
    }
    .isi { width: 100%; text-align: center; }
    .note { font-size: 13px; color: #5f6368; line-height: 1.5; }
    .tunggu { font-size: 13px; font-weight: 600; color: #5f6368; }
    a.tombol {
      display: block; margin-top: 14px; font-size: 14px; font-weight: 700;
      padding: 12px 16px; border-radius: 8px; background: #1a73e8; color: #fff;
      text-decoration: none;
    }
    a.tombol:hover { background: #1765cc; }
    .sembunyi { display: none !important; }
  </style>
</head>
<body>
  <div class="isi">
    <div class="tunggu" id="tunggu">Membuka web&hellip;</div>
    <div class="note sembunyi" id="pesan"></div>
    <a class="tombol sembunyi" id="tombol" href="#" target="_blank" rel="noopener">Buka web &amp; upload foto</a>
  </div>

  <script>
    var url = JSON.parse(<?!= JSON.stringify(url) ?>);
    var note = JSON.parse(<?!= JSON.stringify(note) ?>);

    document.getElementById('tombol').href = url;

    if (note) {
      tampilkan(note);
    } else {
      var w = null;
      try {
        w = window.open(url, '_blank');
      } catch (e) {
      }
      if (w) {
        try { w.opener = null; } catch (e) {}
        google.script.host.close();
      } else {
        tampilkan('Browser menahan tab baru. Klik tombol di bawah untuk membukanya.');
      }
    }

    function tampilkan(pesan) {
      document.getElementById('tunggu').className = 'tunggu sembunyi';
      var p = document.getElementById('pesan');
      p.textContent = pesan;
      p.className = 'note';
      document.getElementById('tombol').className = 'tombol';
    }
  </script>
</body>
</html>
