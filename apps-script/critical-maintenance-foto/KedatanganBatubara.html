<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif; color: #202124; background: #fff;
      font-size: 14px;
    }
    .kepala { background: #6a4429; color: #fff; padding: 12px 18px; }
    .kepala .judul { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
    .isi { padding: 14px 18px; }
    .grup { margin-bottom: 10px; }
    .label {
      display: block; font-size: 12px; font-weight: 600; color: #5f6368;
      margin-bottom: 5px; letter-spacing: .2px;
    }
    input, select {
      width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid #dadce0;
      border-radius: 8px; font: inherit; font-size: 15px; color: #202124; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
    input:disabled, select:disabled { background: #f1f3f4; color: #5f6368; }
    .kolom { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
    .kolom > div { min-width: 0; }
    .tanggal {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      min-height: 42px; padding: 9px 12px; border: 1px solid #dadce0; border-radius: 8px;
      font-size: 15px; background: #fff; cursor: pointer;
    }
    .tanggal:focus-within { border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
    .tanggal svg { flex: none; }
    .tanggal input {
      position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0;
      border: 0; opacity: 0; cursor: pointer;
    }
    .tanggal input::-webkit-calendar-picker-indicator {
      position: absolute; inset: 0; width: auto; height: auto; margin: 0; padding: 0; cursor: pointer;
    }
    .pilihan { display: grid; gap: 8px; }
    .pilihan button, .chips button {
      border: 1px solid #dadce0; background: #fff; font: inherit; font-weight: 600;
      color: #3c4043; cursor: pointer;
    }
    .pilihan button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; min-height: 42px; padding: 5px 4px; border-radius: 8px;
    }
    .pilihan button small { font-size: 11px; font-weight: 500; opacity: .75; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .chips button { min-height: 30px; padding: 4px 12px; border-radius: 16px; font-size: 12px; }
    .pilihan button:hover, .chips button:hover { border-color: #1a73e8; color: #1967d2; }
    .pilihan button[aria-pressed="true"], .chips button[aria-pressed="true"] {
      border-color: #1a73e8; background: #e8f0fe; color: #1967d2;
    }
    .pilihan button:disabled { cursor: not-allowed; opacity: .6; }
    .nama { position: relative; }
    .saran {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 3; margin-top: 4px; padding: 4px 0;
      background: #fff; border: 1px solid #dadce0; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(60, 64, 67, .18);
    }
    .saran button {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
      min-height: 36px; padding: 6px 12px; border: 0; background: none; font: inherit;
      color: #202124; text-align: left; cursor: pointer;
    }
    .saran button[aria-selected="true"], .saran button:hover { background: #f1f3f4; }
    .tag, .lencana {
      flex: none; font-size: 11px; font-weight: 700; color: #fff; border-radius: 10px;
      padding: 2px 8px; text-align: center; white-space: nowrap;
    }
    .tag, .lencana.progres { background: #d35400; }
    .berjalan { margin-top: 6px; }
    .satuan { position: relative; }
    .satuan input { padding-right: 48px; }
    .satuan span {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #5f6368; font-size: 13px; pointer-events: none;
    }
    .bantu { font-size: 12px; color: #5f6368; margin: 5px 0 0; line-height: 1.45; }
    .berjalan .bantu { margin: 0; }
    .info {
      font-size: 12px; line-height: 1.45; color: #3c4043; background: #f1f3f4;
      border-radius: 8px; padding: 7px 10px; margin: 8px 0 0;
    }
    .tautan {
      border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: #1a73e8;
      cursor: pointer; text-decoration: underline;
    }
    .galat {
      font-size: 13px; line-height: 1.5; color: #c5221f; background: #fce8e6;
      border-radius: 8px; padding: 8px 10px; margin: 0 0 10px;
    }
    button.utama {
      width: 100%; min-height: 46px; border: 0; border-radius: 8px; background: #1a73e8;
      color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button.utama:hover { background: #1765cc; }
    button.utama:disabled { background: #c6dafc; cursor: not-allowed; }
    .kedua {
      flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px;
      border: 1px solid #dadce0; border-radius: 8px; background: #fff; color: #1a73e8;
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .kedua:hover { background: #f8fbff; border-color: #1a73e8; }
    .aksi { display: flex; gap: 8px; margin-top: 10px; }
    .aksi button.utama { flex: 1; width: auto; }
    .kaki { margin-top: 6px; padding-top: 12px; border-top: 1px solid #e8eaed; }
    .kaki .aksi { margin-top: 0; }
    .kaki .kedua { flex: 0 0 150px; }
    .layar {
      min-height: 180px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center; color: #5f6368;
      font-size: 13px; font-weight: 600;
    }
    .layar .kedua { flex: none; padding: 0 20px; }
    .bagian {
      display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px;
      font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #5f6368;
    }
    .bagian + .bagian, .jarak { margin-top: 14px; }
    .baris1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .baris1 .nm { flex: none; font-weight: 700; }
    .sub {
      font-size: 12px; color: #5f6368; margin-top: 2px; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .baris1 .sub { flex: 1; margin-top: 0; }
    .kartu, .kartu-riwayat { border-radius: 10px; color: #fff; }
    .kartu .sub, .kartu-riwayat .sub, .kartu .ton small { color: rgba(255, 255, 255, .85); }
    .kartu {
      display: flex; align-items: center; gap: 14px; padding: 10px 14px; margin-bottom: 8px;
      background: #d35400;
    }
    .kartu .teks { flex: 1; min-width: 0; }
    .kartu .nm { font-size: 15px; }
    .kartu .ton { flex: none; text-align: right; font-weight: 700; font-size: 16px; }
    .kartu .ton small { display: block; font-size: 11px; font-weight: 500; }
    .kartu button {
      flex: none; min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px;
      background: #fff; color: #d35400; font: inherit; font-weight: 700; cursor: pointer;
    }
    .kartu button:hover { background: #fdeee3; }
    .kartu.padat { padding: 5px 14px; margin-bottom: 6px; }
    .kartu.padat .nm, .kartu.padat .ton { font-size: 14px; }
    .kartu.padat button { min-height: 28px; padding: 0 12px; font-size: 13px; }
    .riwayat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kartu-riwayat { min-width: 0; padding: 9px 14px; background: #188038; }
    .kartu-riwayat .atas { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .kartu-riwayat .nm {
      font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .kartu-riwayat .ton { flex: none; font-weight: 700; }
    .kosong {
      font-size: 13px; color: #5f6368; padding: 10px 12px; margin-bottom: 8px;
      border: 1px dashed #dadce0; border-radius: 10px;
    }
    .riwayat .kosong { grid-column: 1 / -1; margin: 0; }
    .sukses { font-size: 16px; font-weight: 700; color: #137333; margin: 0 0 10px; }
    .ringkas { margin: 0; border: 1px solid #dadce0; border-radius: 8px; }
    .ringkas div { display: flex; gap: 12px; padding: 8px 12px; border-top: 1px solid #f1f3f4; }
    .ringkas div:first-child { border-top: 0; }
    .ringkas dt { flex: 0 0 104px; font-size: 12px; font-weight: 600; color: #5f6368; }
    .ringkas dd { margin: 0; font-weight: 600; }
    .sembunyi { display: none !important; }
  </style>
</head>
<body>
  <header class="kepala">
    <div class="judul">Kedatangan Batubara</div>
  </header>

  <main class="isi">
    <div class="layar" id="memuat">Memuat data pengiriman&hellip;</div>

    <div class="layar sembunyi" id="gagalMuat">
      <div class="galat" id="gagalMuatPesan"></div>
      <button type="button" class="kedua" id="cobaLagi">Coba lagi</button>
    </div>

    <div class="sembunyi" id="beranda">
      <div class="bagian">In Progress <span class="lencana progres" id="jumlahBerjalan">0</span></div>
      <div id="daftarBerjalan"></div>
      <div class="bagian jarak">History Selesai</div>
      <div class="riwayat" id="daftarRiwayat"></div>
      <div class="kaki jarak">
        <button type="button" class="utama" id="baru">+ Kedatangan baru</button>
      </div>
    </div>

    <form class="sembunyi" id="form" novalidate>
      <div class="kolom">
        <div>
          <div class="grup">
            <label class="label" for="tanggal">Tanggal laporan</label>
            <div class="tanggal">
              <span id="tanggalTeks"></span>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#5f6368" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
              <input type="date" id="tanggal">
            </div>
          </div>
          <div class="grup">
            <span class="label">Shift</span>
            <div class="pilihan" id="pilihShift"></div>
            <p class="bantu sembunyi" id="jendelaMalam"></p>
          </div>
          <div class="grup">
            <span class="label">Asal</span>
            <div class="pilihan" id="pilihAsal"></div>
          </div>
          <div class="grup sembunyi" id="grupMetode">
            <span class="label" id="labelMetode">Unloading via</span>
            <div class="pilihan" id="pilihMetode"></div>
          </div>
        </div>
        <div>
          <div class="grup">
            <label class="label" for="supplier" id="labelSupplier">Nama tongkang / supplier</label>
            <div class="nama">
              <input type="text" id="supplier" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="saran">
              <div class="saran sembunyi" id="saran" role="listbox"></div>
            </div>
            <div class="berjalan sembunyi" id="berjalan">
              <p class="bantu">Masih berjalan — klik untuk melanjutkan:</p>
              <div class="chips" id="chips"></div>
            </div>
            <p class="info sembunyi" id="infoLanjutan"><span id="infoLanjutanTeks"></span> <button type="button" class="tautan" id="batalLanjutan">Batal</button></p>
          </div>
          <div class="grup">
            <label class="label" for="ton" id="labelTon">Tonase</label>
            <div class="satuan">
              <input type="text" id="ton" inputmode="decimal" autocomplete="off" placeholder="0">
              <span>ton</span>
            </div>
            <p class="bantu sembunyi" id="tonBantu">Kosong = hanya menandai pengiriman selesai; denah tidak berubah.</p>
          </div>
          <div class="grup">
            <label class="label" for="zona">Ditaruh di pilar</label>
            <select id="zona"></select>
          </div>
          <div class="grup">
            <span class="label">Status</span>
            <div class="pilihan" id="pilihStatus"></div>
          </div>
        </div>
      </div>
      <div class="kaki">
        <p class="galat sembunyi" id="galatSimpan"></p>
        <div class="aksi">
          <button type="button" class="kedua" id="kembali">← Kembali</button>
          <button type="submit" class="utama" id="simpan" disabled>Simpan</button>
        </div>
      </div>
    </form>

    <div class="sembunyi" id="hasil">
      <div class="sukses" id="hasilJudul">Tersimpan</div>
      <dl class="ringkas" id="ringkas"></dl>
      <p class="info" id="hasilCatatan"></p>
      <p class="galat sembunyi jarak" id="hasilPeringatan"></p>
      <div class="aksi jarak">
        <button type="button" class="kedua sembunyi" id="keCatatan">Lihat di Catatan</button>
        <a class="kedua" id="keDenah" href="#" target="_blank" rel="noopener">Lihat denah</a>
      </div>
      <div class="aksi">
        <button type="button" class="kedua" id="keDaftar">Kembali ke daftar</button>
        <button type="button" class="utama" id="tutup">Tutup</button>
      </div>
    </div>
  </main>

  <script>
    var cfg = JSON.parse(<?!= JSON.stringify(cfg) ?>);
    var API = cfg.appUrl + '/api/sheets/kedatangan-batubara';
    var SHIFT_OPSI = [
      { value: 'malam', label: 'Malam', jam: '23.00–07.00', warna: '#1d3557', teks: '#fff' },
      { value: 'pagi', label: 'Pagi', jam: '07.00–15.00', warna: '#e0b000', teks: '#1c1606' },
      { value: 'sore', label: 'Sore', jam: '15.00–23.00', warna: '#b04a1c', teks: '#fff' }
    ];
    var STATUS_OPSI = [
      { value: 'progres', label: 'In Progress', warna: '#d35400', teks: '#fff' },
      { value: 'selesai', label: 'Selesai', warna: '#188038', teks: '#fff' }
    ];
    var ASAL_LABEL = { tongkang: 'Tongkang', darat: 'Darat (Lokal)' };
    var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var BULAN_PENDEK = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    var MAKS_SARAN = 6;
    var MAKS_KARTU_LENGKAP = 3;
    var MAKS_RIWAYAT_PADAT = 2;

    var el = function (id) { return document.getElementById(id); };
    var st = { info: null, shift: null, asal: null, metode: null, status: 'progres', induk: null, batchId: '', menyimpan: false, barisCatatan: null, saran: [], saranAktif: -1, saranTutup: false, tinggi: 0 };

    function tampil(id) {
      ['memuat', 'gagalMuat', 'beranda', 'form', 'hasil'].forEach(function (x) {
        el(x).classList.toggle('sembunyi', x !== id);
      });
      sesuaikanTinggi();
    }

    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      var b = new Uint8Array(16);
      crypto.getRandomValues(b);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      var h = Array.prototype.map.call(b, function (x) { return (x + 0x100).toString(16).slice(1); }).join('');
      return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
    }

    function api(method, body) {
      var opsi = { method: method, headers: { Authorization: 'Bearer ' + cfg.secret } };
      if (body) {
        opsi.headers['Content-Type'] = 'application/json';
        opsi.body = JSON.stringify(body);
      }
      return fetch(API, opsi).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error || ('Server membalas ' + r.status));
          return j;
        });
      }, function () {
        throw new Error('Tidak bisa menghubungi ' + cfg.appUrl + '. Periksa koneksi lalu coba lagi.');
      });
    }

    function labelDari(daftar, nilai) {
      for (var i = 0; i < daftar.length; i++) if (daftar[i].value === nilai) return daftar[i].label;
      return nilai || '';
    }

    function labelAsal(asal) { return ASAL_LABEL[asal] || asal || ''; }

    function fmtTon(n) { return Number(n || 0).toLocaleString('id-ID'); }

    function keTanggal(iso) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
      var p = iso.split('-').map(Number);
      var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
      return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2] ? d : null;
    }

    function tanggalSah(iso) { return !!keTanggal(iso); }

    function fmtTanggal(iso) {
      var d = keTanggal(iso);
      if (!d) return '';
      return HARI[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    }

    function fmtPendek(iso, tanpaTahun) {
      var d = keTanggal(iso);
      if (!d) return '';
      return d.getUTCDate() + ' ' + BULAN_PENDEK[d.getUTCMonth()] + (tanpaTahun ? '' : ' ' + d.getUTCFullYear());
    }

    function fmtRentang(mulai, selesai) {
      var a = keTanggal(mulai);
      var b = keTanggal(selesai);
      if (!a) return '';
      if (!b) return 'mulai ' + fmtPendek(mulai);
      if (mulai === selesai) return fmtPendek(mulai);
      if (a.getUTCFullYear() !== b.getUTCFullYear()) return fmtPendek(mulai) + ' – ' + fmtPendek(selesai);
      if (a.getUTCMonth() !== b.getUTCMonth()) return fmtPendek(mulai, true) + ' – ' + fmtPendek(selesai);
      return a.getUTCDate() + '–' + fmtPendek(selesai);
    }

    function pilarRingkas(zonas) {
      var per = {};
      var urutan = [];
      var nomor = function (z) { return parseInt(String(z).slice(1), 10) || 0; };
      (zonas || []).slice().sort(function (a, b) { return a.charAt(0).localeCompare(b.charAt(0)) || nomor(a) - nomor(b); }).forEach(function (z) {
        var bagian = labelDari(st.info.zona, z).split(' · ');
        var area = bagian[0];
        if (!per[area]) { per[area] = []; urutan.push(area); }
        per[area].push((bagian[1] || '').replace(/pilar /g, ''));
      });
      return urutan.map(function (a) { return a + ' ' + per[a].join(', '); }).join(' · ');
    }

    function teksJendelaMalam(iso) {
      var d = keTanggal(iso);
      if (!d) return '';
      var kemarin = new Date(d.getTime() - 86400000);
      return 'Shift malam: ' + HARI[kemarin.getUTCDay()] + ' 23.00 → ' + HARI[d.getUTCDay()] + ' 07.00';
    }

    function formatTon(v) {
      var bersih = String(v || '').replace(/[^\d,]/g, '');
      var koma = bersih.indexOf(',');
      var bulat = (koma >= 0 ? bersih.slice(0, koma) : bersih).replace(/^0+(?=\d)/, '');
      var ribuan = bulat.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      if (koma < 0) return ribuan;
      return (ribuan || '0') + ',' + bersih.slice(koma + 1).replace(/,/g, '').slice(0, 2);
    }

    function parseTon(s) {
      var t = String(s || '').replace(/\./g, '').replace(',', '.');
      if (!/\d/.test(t)) return null;
      var n = parseFloat(t);
      return isNaN(n) ? null : n;
    }

    function ketikTon() {
      var input = el('ton');
      var posisi = input.selectionStart == null ? input.value.length : input.selectionStart;
      var jumlahKiri = input.value.slice(0, posisi).replace(/[^\d,]/g, '').length;
      var baru = formatTon(input.value);
      input.value = baru;
      var i = 0;
      for (var n = 0; i < baru.length && n < jumlahKiri; i++) if (/[\d,]/.test(baru.charAt(i))) n++;
      try { input.setSelectionRange(i, i); } catch (e) {}
      render();
    }

    function buat(tag, kelas, teks) {
      var e = document.createElement(tag);
      if (kelas) e.className = kelas;
      if (teks != null) e.textContent = teks;
      return e;
    }

    function renderBeranda() {
      var r = st.info.ringkasan || { berjalan: [], selesai: [] };
      el('jumlahBerjalan').textContent = r.berjalan.length;
      var wb = el('daftarBerjalan');
      wb.textContent = '';
      if (!r.berjalan.length) wb.appendChild(buat('div', 'kosong', 'Tidak ada kedatangan yang sedang berjalan.'));
      var padat = r.berjalan.length > MAKS_KARTU_LENGKAP;
      r.berjalan.forEach(function (p) {
        var kartu = buat('div', 'kartu' + (padat ? ' padat' : ''));
        var teks = buat('div', 'teks');
        var asal = [labelAsal(p.asal), p.metode.map(function (m) { return labelDari(st.info.metode, m); }).join(' + '), pilarRingkas(p.zona)]
          .filter(Boolean).join(' · ');
        var baris1 = buat('div', 'baris1');
        baris1.appendChild(buat('span', 'nm', p.supplier));
        baris1.appendChild(buat('span', 'sub', padat ? asal + ' · mulai ' + fmtPendek(p.mulai) : asal));
        teks.appendChild(baris1);
        if (!padat) {
          teks.appendChild(buat('div', 'sub', 'Mulai ' + fmtPendek(p.mulai) + ' · terakhir dicatat Shift '
            + labelDari(SHIFT_OPSI, p.terakhir.shift) + ', ' + fmtPendek(p.terakhir.date)));
        }
        kartu.appendChild(teks);
        var ton = buat('div', 'ton', fmtTon(p.ton) + ' t');
        if (!padat) ton.appendChild(buat('small', '', 'sejauh ini'));
        kartu.appendChild(ton);
        var lanjut = buat('button', '', 'Lanjutkan');
        lanjut.type = 'button';
        lanjut.addEventListener('click', function () { bukaForm(p.batch_id); });
        kartu.appendChild(lanjut);
        wb.appendChild(kartu);
      });

      var wr = el('daftarRiwayat');
      wr.textContent = '';
      if (!r.selesai.length) wr.appendChild(buat('div', 'kosong', 'Belum ada riwayat.'));
      r.selesai.slice(0, padat ? MAKS_RIWAYAT_PADAT : r.selesai.length).forEach(function (p) {
        var kartu = buat('div', 'kartu-riwayat');
        var atas = buat('div', 'atas');
        atas.appendChild(buat('span', 'nm', p.supplier));
        atas.appendChild(buat('span', 'ton', p.ton == null ? '—' : fmtTon(p.ton) + ' t'));
        kartu.appendChild(atas);
        var sub = [fmtRentang(p.mulai, p.selesai), labelAsal(p.asal), pilarRingkas(p.zona)].filter(Boolean).join(' · ');
        var subEl = buat('div', 'sub', sub);
        subEl.title = sub;
        kartu.appendChild(subEl);
        wr.appendChild(kartu);
      });
    }

    function sesuaikanTinggi() {
      var tinggi = Math.ceil(document.body.getBoundingClientRect().height) + 2;
      if (tinggi === st.tinggi) return;
      st.tinggi = tinggi;
      try { google.script.host.setHeight(tinggi); } catch (e) {}
    }

    function pilihan(wadah, opsi, nilai, onPilih, terkunci) {
      var w = el(wadah);
      w.textContent = '';
      w.style.gridTemplateColumns = 'repeat(' + opsi.length + ', 1fr)';
      opsi.forEach(function (o) {
        var b = document.createElement('button');
        var aktif = o.value === nilai;
        b.type = 'button';
        b.appendChild(document.createTextNode(o.label));
        if (o.jam) b.appendChild(buat('small', '', o.jam));
        b.setAttribute('aria-pressed', aktif ? 'true' : 'false');
        if (aktif && o.warna) {
          b.style.background = o.warna;
          b.style.borderColor = o.warna;
          b.style.color = o.teks;
        }
        b.disabled = !!terkunci;
        b.addEventListener('click', function () { onPilih(o.value); });
        w.appendChild(b);
      });
    }

    function render() {
      var info = st.info;
      var lanjutan = !!st.induk;
      el('tanggalTeks').textContent = fmtTanggal(el('tanggal').value) || 'Pilih tanggal';
      pilihan('pilihShift', SHIFT_OPSI, st.shift, function (v) { st.shift = v; render(); });
      el('jendelaMalam').textContent = st.shift === 'malam' ? teksJendelaMalam(el('tanggal').value) : '';
      el('jendelaMalam').classList.toggle('sembunyi', !el('jendelaMalam').textContent);
      var opsiAsal = info.asal.map(function (a) { return { value: a.value, label: labelAsal(a.value) }; });
      pilihan('pilihAsal', opsiAsal, st.asal, function (v) {
        st.asal = v;
        if (v !== 'tongkang') st.metode = null;
        render();
      }, lanjutan && !!st.induk.asal);
      el('grupMetode').classList.toggle('sembunyi', st.asal !== 'tongkang');
      pilihan('pilihMetode', info.metode, st.metode, function (v) { st.metode = v; render(); });
      pilihan('pilihStatus', STATUS_OPSI, st.status, function (v) { st.status = v; render(); });

      el('labelSupplier').textContent = st.asal === 'darat' ? 'Supplier / PT' : 'Nama tongkang / supplier';
      el('supplier').placeholder = st.asal === 'darat' ? 'Nama PT…' : 'Nama tongkang…';
      el('supplier').disabled = lanjutan;
      el('zona').disabled = lanjutan;
      renderSaran();
      renderChips();

      var t = parseTon(el('ton').value);
      var bolehKosong = lanjutan && st.status === 'selesai';
      el('labelTon').textContent = bolehKosong ? 'Tonase (boleh kosong)' : 'Tonase';
      el('labelMetode').textContent = penutup() ? 'Unloading via (boleh kosong)' : 'Unloading via';
      el('tonBantu').classList.toggle('sembunyi', !(bolehKosong && t === null));

      el('simpan').disabled = !valid() || st.menyimpan;
      el('simpan').textContent = st.menyimpan ? 'Menyimpan…' : 'Simpan';
      sesuaikanTinggi();
    }

    function daftarSaran() {
      var q = el('supplier').value.trim().toLowerCase();
      if (!q || st.induk || st.saranTutup || document.activeElement !== el('supplier')) return [];
      var berjalan = {};
      st.info.berjalan.forEach(function (b) {
        var k = b.supplier.toLowerCase();
        if (!berjalan[k]) berjalan[k] = b;
      });
      var nama = st.info.suppliers.slice();
      st.info.berjalan.forEach(function (b) { if (nama.indexOf(b.supplier) < 0) nama.push(b.supplier); });
      var awalan = function (n) { return n.toLowerCase().indexOf(q) === 0 ? 0 : 1; };
      return nama
        .filter(function (n) {
          var k = n.toLowerCase();
          return k.indexOf(q) >= 0 && (k !== q || !!berjalan[k]);
        })
        .sort(function (a, b) { return awalan(a) - awalan(b) || a.localeCompare(b, 'id'); })
        .slice(0, MAKS_SARAN)
        .map(function (n) { return { nama: n, induk: berjalan[n.toLowerCase()] || null }; });
    }

    function renderSaran() {
      var daftar = daftarSaran();
      st.saran = daftar;
      if (st.saranAktif >= daftar.length) st.saranAktif = -1;
      var w = el('saran');
      w.textContent = '';
      w.classList.toggle('sembunyi', daftar.length === 0);
      el('supplier').setAttribute('aria-expanded', daftar.length > 0 ? 'true' : 'false');
      daftar.forEach(function (s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.tabIndex = -1;
        b.setAttribute('role', 'option');
        b.setAttribute('aria-selected', i === st.saranAktif ? 'true' : 'false');
        b.appendChild(buat('span', '', s.nama));
        if (s.induk) b.appendChild(buat('span', 'tag', 'masih berjalan'));
        b.addEventListener('mousedown', function (ev) {
          ev.preventDefault();
          pilihSaran(s);
        });
        w.appendChild(b);
      });
    }

    function pilihSaran(s) {
      st.saranAktif = -1;
      if (s.induk) {
        setInduk(s.induk.batch_id);
        return;
      }
      el('supplier').value = s.nama;
      st.saranTutup = true;
      render();
    }

    function tombolSaran(ev) {
      var n = st.saran.length;
      if (ev.key === 'ArrowDown' && n) {
        ev.preventDefault();
        st.saranAktif = (st.saranAktif + 1) % n;
        renderSaran();
      } else if (ev.key === 'ArrowUp' && n) {
        ev.preventDefault();
        st.saranAktif = st.saranAktif <= 0 ? n - 1 : st.saranAktif - 1;
        renderSaran();
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (st.saranAktif >= 0 && st.saran[st.saranAktif]) pilihSaran(st.saran[st.saranAktif]);
      } else if (ev.key === 'Escape' && n) {
        ev.preventDefault();
        st.saranTutup = true;
        renderSaran();
      }
    }

    function renderChips() {
      var daftar = st.info.berjalan;
      el('berjalan').classList.toggle('sembunyi', daftar.length === 0 || !!st.induk);
      var w = el('chips');
      w.textContent = '';
      var jumlahNama = {};
      daftar.forEach(function (b) { jumlahNama[b.supplier] = (jumlahNama[b.supplier] || 0) + 1; });
      daftar.forEach(function (b) {
        var dipilih = !!st.induk && st.induk.batch_id === b.batch_id;
        var zona = labelDari(st.info.zona, b.zona);
        var c = buat('button', '', b.supplier + (jumlahNama[b.supplier] > 1 ? ' · ' + zona : ''));
        c.type = 'button';
        c.title = (b.asal ? labelAsal(b.asal) + ' · ' : '') + zona + ' · ' + fmtTon(b.tonSejauhIni) + ' t sejauh ini';
        c.setAttribute('aria-pressed', dipilih ? 'true' : 'false');
        c.addEventListener('click', function () { setInduk(dipilih ? '' : b.batch_id); });
        w.appendChild(c);
      });
    }

    function penutup() {
      var t = parseTon(el('ton').value);
      return !!st.induk && st.status === 'selesai' && !(t > 0);
    }

    function valid() {
      if (!tanggalSah(el('tanggal').value) || !st.shift || !st.asal) return false;
      if (!el('supplier').value.trim() || !el('zona').value) return false;
      var t = parseTon(el('ton').value);
      if (!(t > 0) && !penutup()) return false;
      return st.asal !== 'tongkang' || !!st.metode || penutup();
    }

    function setInduk(batchId) {
      var induk = null;
      st.info.berjalan.forEach(function (b) { if (b.batch_id === batchId) induk = b; });
      st.induk = induk;
      st.batchId = induk ? induk.batch_id : uuid();
      st.asal = induk ? induk.asal : null;
      st.metode = null;
      st.status = 'progres';
      st.saranAktif = -1;
      el('supplier').value = induk ? induk.supplier : '';
      el('zona').value = induk ? induk.zona : '';
      el('ton').value = '';
      el('infoLanjutan').classList.toggle('sembunyi', !induk);
      el('infoLanjutanTeks').textContent = induk
        ? 'Lanjutan ' + induk.supplier + ' · ' + labelDari(st.info.zona, induk.zona) + ' · ' + fmtTon(induk.tonSejauhIni)
          + ' t sejauh ini. Nama, pilar & asal terkunci.'
        : '';
      render();
    }

    function bukaForm(batchId) {
      st.shift = st.info.default.shift;
      el('tanggal').value = st.info.default.date;
      el('galatSimpan').classList.add('sembunyi');
      setInduk(batchId || '');
      tampil('form');
    }

    function isiForm(info) {
      st.info = info;
      st.shift = info.default.shift;
      el('tanggal').value = info.default.date;

      var zona = el('zona');
      zona.textContent = '';
      var kosong = buat('option', '', 'Pilih pilar…');
      kosong.value = '';
      zona.appendChild(kosong);
      info.zona.forEach(function (z) {
        var o = buat('option', '', z.label);
        o.value = z.value;
        zona.appendChild(o);
      });

      setInduk('');
      renderBeranda();
      tampil('beranda');
    }

    function muat() {
      tampil('memuat');
      api('GET').then(isiForm, function (err) {
        el('gagalMuatPesan').textContent = err.message;
        tampil('gagalMuat');
      });
    }

    function simpan(ev) {
      ev.preventDefault();
      if (!valid() || st.menyimpan) return;
      st.menyimpan = true;
      el('galatSimpan').classList.add('sembunyi');
      render();
      var t = parseTon(el('ton').value);
      api('POST', {
        date: el('tanggal').value,
        shift: st.shift,
        lanjutan_batch_id: st.induk ? st.induk.batch_id : null,
        entry: {
          batch_id: st.batchId,
          supplier: el('supplier').value.trim(),
          zona: el('zona').value,
          ton: t > 0 ? t : 0,
          tanggal_masuk: st.induk ? st.induk.tanggal_masuk : el('tanggal').value,
          status: st.status,
          asal: st.asal,
          metode_unloading: st.asal === 'tongkang' ? st.metode : null
        }
      }).then(tampilHasil, function (err) {
        el('galatSimpan').textContent = err.message;
        el('galatSimpan').classList.remove('sembunyi');
      }).then(function () {
        st.menyimpan = false;
        if (st.info) render();
      });
    }

    function baris(dl, label, isi) {
      var d = document.createElement('div');
      d.appendChild(buat('dt', '', label));
      d.appendChild(buat('dd', '', isi));
      dl.appendChild(d);
    }

    function tampilHasil(res) {
      var r = res.ringkasan;
      el('hasilJudul').textContent = res.dobel ? 'Sudah tersimpan sebelumnya' : 'Tersimpan';
      var dl = el('ringkas');
      dl.textContent = '';
      baris(dl, 'Laporan', 'Shift ' + labelDari(SHIFT_OPSI, r.shift) + ' · ' + fmtTanggal(r.date));
      baris(dl, 'Nama', r.supplier);
      baris(dl, 'Via', r.asal === 'darat' ? labelAsal('darat') : labelDari(st.info.metode, r.metode_unloading) || '-');
      baris(dl, 'Letak', r.zonaLabel);
      baris(dl, 'Tonase', '+' + fmtTon(r.ton) + ' ton (kumulatif ' + fmtTon(r.tonKumulatif) + ' ton)');
      baris(dl, 'Status', labelDari(STATUS_OPSI, r.status));

      st.barisCatatan = null;
      var teks = (res.catatan || []).map(function (c) {
        var siapa = 'Shift ' + labelDari(SHIFT_OPSI, c.shift) + ' · ' + fmtTanggal(c.date);
        if (c.date === r.date && c.shift === r.shift && c.rowIndex) st.barisCatatan = c.rowIndex;
        if (c.action === 'created') return 'Kolom H Catatan: baris baru ' + c.rowIndex + ' dibuat (' + siapa + ').';
        if (c.action === 'updated') return 'Kolom H Catatan baris ' + c.rowIndex + ' diperbarui (' + siapa + ').';
        return 'Kolom H Catatan ' + siapa + ': tidak berubah' + (c.reason ? ' — ' + c.reason : '') + '.';
      });
      el('hasilCatatan').textContent = teks.join(' ');
      el('hasilCatatan').classList.toggle('sembunyi', teks.length === 0);
      el('hasilPeringatan').textContent = res.warning || '';
      el('hasilPeringatan').classList.toggle('sembunyi', !res.warning);
      el('keCatatan').classList.toggle('sembunyi', !st.barisCatatan);
      el('keDenah').href = cfg.appUrl + '/coal-storage';
      tampil('hasil');
    }

    el('form').addEventListener('submit', simpan);
    el('cobaLagi').addEventListener('click', muat);
    el('baru').addEventListener('click', function () { bukaForm(''); });
    el('kembali').addEventListener('click', function () { tampil('beranda'); });
    el('batalLanjutan').addEventListener('click', function () { setInduk(''); });
    el('tanggal').addEventListener('change', render);
    el('tanggal').addEventListener('input', render);
    el('supplier').addEventListener('input', function () {
      st.saranTutup = false;
      st.saranAktif = -1;
      render();
    });
    el('supplier').addEventListener('focus', render);
    el('supplier').addEventListener('blur', renderSaran);
    el('supplier').addEventListener('keydown', tombolSaran);
    el('ton').addEventListener('input', ketikTon);
    el('zona').addEventListener('change', render);
    el('keDaftar').addEventListener('click', muat);
    el('tutup').addEventListener('click', function () { google.script.host.close(); });
    el('keCatatan').addEventListener('click', function () {
      el('keCatatan').disabled = true;
      google.script.run
        .withSuccessHandler(function () { google.script.host.close(); })
        .withFailureHandler(function () { el('keCatatan').disabled = false; })
        .bukaBarisCatatan(st.barisCatatan);
    });

    muat();
  </script>
</body>
</html>
